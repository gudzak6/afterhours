services:
  - type: web
    name: trainingcoach-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GARMIN_PERSONAL_API_KEY
        sync: false
      - key: GARMIN_SYNC_INTERVAL_MINUTES
        value: "360"
