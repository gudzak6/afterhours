[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trainingcoach-backend"
version = "0.1.0"
description = "AI running coach API: Garmin import, workout metrics, and coaching reports."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "garmin-connect-personal-api-python>=1.0,<2",
  "curl_cffi>=0.7,<0.16",
  "apscheduler>=3.10,<4",
  "fitdecode>=0.10",
  "numpy>=2",
  "pandas>=2.2",
  "openai>=1.50",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
  "numpy>=2",
  "fitdecode>=0.10",
]
ai = [
  "openai>=1.50",
]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
